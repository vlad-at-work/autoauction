name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_MAX_BOT_NAME: ${{ secrets.NEXT_PUBLIC_MAX_BOT_NAME }}
          NEXT_PUBLIC_MAX_BOT_NAME_DEALER: ${{ secrets.NEXT_PUBLIC_MAX_BOT_NAME_DEALER }}
          NEXT_PUBLIC_TELEGRAM_BOT_NAME: ${{ secrets.NEXT_PUBLIC_TELEGRAM_BOT_NAME }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

      - name: Deploy standalone build
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: autoauction
          SOURCE: ".next/standalone/"
          TARGET: "/home/autoauction/app/"
          EXCLUDE: ".env"

      - name: Deploy static assets
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: autoauction
          SOURCE: ".next/static/"
          TARGET: "/home/autoauction/app/.next/static/"

      - name: Deploy public folder
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: autoauction
          SOURCE: "public/"
          TARGET: "/home/autoauction/app/public/"

      - name: Restart app
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: autoauction
          key: ${{ secrets.VPS_SSH_KEY }}
          script: sudo systemctl restart autoauction

      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.NOTIFICATION_TG_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            <code>${{ github.event.head_commit.message }}</code> <b>Deploy ${{ job.status == 'success' && '✅ SUCCESS' || '❌ FAILED' }}</b>
            
            <b>Repo:</b> <code>${{ github.repository }}</code>
            <b>Branch:</b> <code>${{ github.ref_name }}</code>
            ${{ github.actor }}
            
            <b>Commit: ${{ github.sha }}</b>
            ${{ github.event.head_commit.timestamp }}