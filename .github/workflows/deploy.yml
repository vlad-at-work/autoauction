name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('bun.lock', 'prisma/schema.prisma') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: bun install

      - name: Generate Prisma client
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: bunx prisma generate

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_MAX_BOT_NAME: ${{ secrets.NEXT_PUBLIC_MAX_BOT_NAME }}
          NEXT_PUBLIC_MAX_BOT_NAME_DEALER: ${{ secrets.NEXT_PUBLIC_MAX_BOT_NAME_DEALER }}
          NEXT_PUBLIC_TELEGRAM_BOT_NAME: ${{ secrets.NEXT_PUBLIC_TELEGRAM_BOT_NAME }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

      - name: Copy request-logger into standalone
        run: cp request-logger.js .next/standalone/

      - name: Deploy standalone build
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: autoauction
          SOURCE: ".next/standalone/"
          TARGET: "/home/autoauction/app/"
          EXCLUDE: ".env"

      - name: Deploy static assets
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: autoauction
          SOURCE: ".next/static/"
          TARGET: "/home/autoauction/app/.next/static/"

      - name: Deploy public folder
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: autoauction
          SOURCE: "public/"
          TARGET: "/home/autoauction/app/public/"

      - name: Restart app
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: autoauction
          key: ${{ secrets.VPS_SSH_KEY }}
          script: sudo systemctl restart autoauction

      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@v0.1.1
        with:
          to: ${{ secrets.NOTIFICATION_TG_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            *${{ job.status == 'success' && '✅' || '❌' }}* `${{ github.event.head_commit.message }}`

            *Repo:* `${{ github.repository }}`
            *Branch:* `${{ github.ref_name }}`
            ${{ github.actor }}

            *Commit:* `${{ github.sha }}`
            ${{ github.event.head_commit.timestamp }}