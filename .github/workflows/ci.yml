name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_APP_URL: https://svoauto.ru
          NEXT_PUBLIC_MAX_BOT_NAME: placeholder
          NEXT_PUBLIC_MAX_BOT_NAME_DEALER: placeholder
          NEXT_PUBLIC_TELEGRAM_BOT_NAME: placeholder
          NEXT_PUBLIC_SENTRY_DSN: placeholder
