name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('bun.lock', 'prisma/schema.prisma') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: bun install

      - name: Generate Prisma client
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: bunx prisma generate

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_APP_URL: https://svoauto.ru
          NEXT_PUBLIC_MAX_BOT_NAME: placeholder
          NEXT_PUBLIC_MAX_BOT_NAME_DEALER: placeholder
          NEXT_PUBLIC_TELEGRAM_BOT_NAME: placeholder
          NEXT_PUBLIC_SENTRY_DSN: placeholder
